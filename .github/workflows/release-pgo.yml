name: Patched image with PGO

on:
  push:
    branches: [v2.3.6-slatedb-local]
  workflow_dispatch:
    inputs:
      slatedb_ref:
        description: "Ref of hzhou0/slatedb to build against"
        required: false
        default: v0.17.0-clamp

env:
  CARGO_TERM_COLOR: always
  SLATEDB_REF: ${{ inputs.slatedb_ref || 'v0.17.0-clamp' }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-instrumented:
    name: Build instrumented binary for profiling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: hzhou0/slatedb
          ref: ${{ env.SLATEDB_REF }}
          path: slatedb-src

      # zerofs/Cargo.toml patches SlateDB through a path outside this checkout.
      - name: Place the SlateDB checkout
        run: mv slatedb-src ../slatedb

      - name: Install Rust with PGO support
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
          targets: x86_64-unknown-linux-musl

      - name: Setup musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          # Profile a musl build so the PGO data matches the musl release targets.
          # The C deps (jemalloc, lz4, zstd, ring) need a musl C compiler.
          echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"

      - name: Build with PGO instrumentation
        working-directory: zerofs
        run: |
          RUSTFLAGS="--cfg tokio_unstable --cfg io_uring_skip_arch_check -Cprofile-generate=/tmp/pgo-data" \
            cargo build --release --target=x86_64-unknown-linux-musl

      # One instrumented binary feeds every profiling workload below. The
      # profile output path is chosen at runtime via LLVM_PROFILE_FILE, so the
      # same binary profiles 9p/fuse/zfs/nfs without a rebuild per matrix leg.
      - name: Upload instrumented binary
        uses: actions/upload-artifact@v4
        with:
          name: zerofs-instrumented
          path: zerofs/target/x86_64-unknown-linux-musl/release/zerofs
          retention-days: 1

  collect-pgo-profile:
    name: Collect PGO Profile Data - ${{ matrix.test }}
    needs: build-instrumented
    runs-on: ubuntu-latest
    strategy:
      matrix:
        test: [9p, fuse, zfs-on-zerofs, nfs-kernel-compile]

    steps:
      - uses: actions/checkout@v4

      # llvm-tools-preview supplies llvm-profdata for the merge step; no
      # compilation happens here, so the musl target/toolchain aren't needed.
      - name: Install Rust with PGO support
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Download instrumented binary
        uses: actions/download-artifact@v4
        with:
          name: zerofs-instrumented
          path: zerofs/target/x86_64-unknown-linux-musl/release/

      - name: Make instrumented binary executable
        run: chmod +x zerofs/target/x86_64-unknown-linux-musl/release/zerofs

      - name: Install dependencies
        run: |
          sudo apt-get update
          # build-essential/bison/flex/... drive the in-tree kernel-compile workload.
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev bc

          if [ "${{ matrix.test }}" = "9p" ]; then
            sudo modprobe 9p
            sudo modprobe 9pnet
            sudo modprobe 9pnet_virtio
          elif [ "${{ matrix.test }}" = "fuse" ]; then
            sudo apt-get install -y fuse3
          elif [ "${{ matrix.test }}" = "zfs-on-zerofs" ]; then
            sudo apt-get install -y nbd-client zfsutils-linux wget pigz pixz parallel
          elif [ "${{ matrix.test }}" = "nfs-kernel-compile" ]; then
            sudo apt-get install -y nfs-common
          fi

      - name: Start SeaweedFS
        run: bash .github/scripts/seaweedfs.sh start pgo-profile,pgo-fuse-test,pgo-zfs-test,pgo-nfs-test

      - name: Run profiling workloads
        env:
          # Per-PID profile files. The fuse test runs two instrumented processes
          # (the user-owned `zerofs run` server and the root `sudo zerofs mount`
          # client). Without %p both target the same default profraw path and the
          # second writer hits "Permission denied", silently dropping a profile.
          LLVM_PROFILE_FILE: /tmp/pgo-data/zerofs-%p.profraw
        run: |
          # Pre-create writable by both the user server and the root mount, so
          # whichever exits first doesn't create it root-owned and lock the other out.
          mkdir -p /tmp/pgo-data && chmod 777 /tmp/pgo-data
          mkdir -p /tmp/zerofs-cache

          # Create ZeroFS configuration based on test type
          if [ "${{ matrix.test }}" = "9p" ]; then
            cat > zerofs-pgo.toml << EOF
          [cache]
          dir = "/tmp/zerofs-cache"
          disk_size_gb = 0.5
          memory_size_gb = 2.0

          [storage]
          url = "s3://pgo-profile/test"
          encryption_password = "test-password-123"

          [servers.ninep]
          addresses = ["127.0.0.1:5564"]

          [aws]
          access_key_id = "zerofsadmin"
          secret_access_key = "zerofsadmin"
          endpoint = "http://localhost:9000"
          allow_http = "true"

          [telemetry]
          enabled = false
          EOF
            ./zerofs/target/x86_64-unknown-linux-musl/release/zerofs run -c zerofs-pgo.toml &
            ZEROFS_PID=$!
            echo "Waiting for ZeroFS 9P server to start..."
            for i in {1..30}; do
              if nc -z 127.0.0.1 5564 2>/dev/null; then
                echo "ZeroFS 9P server is ready"
                break
              fi
              sleep 1
            done

            sudo mkdir -p /mnt/zerofs
            sudo mount -t 9p -o trans=tcp,port=5564,version=9p2000.L,cache=mmap,access=user 127.0.0.1 /mnt/zerofs
            cd /mnt/zerofs
            wget -q https://git.kernel.org/torvalds/t/linux-7.2-rc1.tar.gz
            tar -xf linux-7.2-rc1.tar.gz
            cd linux-7.2-rc1
            make tinyconfig
            make -j$(nproc)
            cd /mnt/zerofs
            dd if=/dev/urandom of=500mb.bin bs=1M count=500
            dd if=500mb.bin of=/dev/null bs=1M
            cd /
            sudo umount /mnt/zerofs || true
            kill -TERM $ZEROFS_PID || true
            wait $ZEROFS_PID || true

          elif [ "${{ matrix.test }}" = "fuse" ]; then
            cat > zerofs-pgo.toml << EOF
          [cache]
          dir = "/tmp/zerofs-cache"
          disk_size_gb = 0.5
          memory_size_gb = 2.0

          [storage]
          url = "s3://pgo-fuse-test/test"
          encryption_password = "test-password-123"

          [servers.ninep]
          addresses = ["127.0.0.1:5564"]

          [aws]
          access_key_id = "zerofsadmin"
          secret_access_key = "zerofsadmin"
          endpoint = "http://localhost:9000"
          allow_http = "true"

          [telemetry]
          enabled = false
          EOF
            ./zerofs/target/x86_64-unknown-linux-musl/release/zerofs run -c zerofs-pgo.toml &
            ZEROFS_PID=$!
            echo "Waiting for ZeroFS 9P server to start..."
            for i in {1..30}; do
              if nc -z 127.0.0.1 5564 2>/dev/null; then
                echo "ZeroFS 9P server is ready"
                break
              fi
              sleep 1
            done

            sudo mkdir -p /mnt/zerofs
            # Drive the workload through the FUSE client. It's the same instrumented
            # binary, so this profiles both the server and the zerofs mount path.
            sudo env LLVM_PROFILE_FILE="$LLVM_PROFILE_FILE" ./zerofs/target/x86_64-unknown-linux-musl/release/zerofs mount --access all 127.0.0.1:5564 /mnt/zerofs &
            for i in {1..60}; do
              mountpoint -q /mnt/zerofs && break
              sleep 0.5
            done
            cd /mnt/zerofs
            wget -q https://git.kernel.org/torvalds/t/linux-7.2-rc1.tar.gz
            tar -xf linux-7.2-rc1.tar.gz
            cd linux-7.2-rc1
            make tinyconfig
            make -j$(nproc)
            cd /mnt/zerofs
            dd if=/dev/urandom of=500mb.bin bs=1M count=500
            dd if=500mb.bin of=/dev/null bs=1M
            cd /
            sudo fusermount3 -u /mnt/zerofs || sudo umount /mnt/zerofs || true
            sudo pkill -TERM -f "zerofs mount" || true
            kill -TERM $ZEROFS_PID || true
            wait $ZEROFS_PID || true

          elif [ "${{ matrix.test }}" = "zfs-on-zerofs" ]; then
            cat > zerofs-pgo.toml << EOF
          [cache]
          dir = "/tmp/zerofs-cache"
          disk_size_gb = 5.0
          memory_size_gb = 2.0

          [storage]
          url = "s3://pgo-zfs-test/zfs-test"
          encryption_password = "test-password-123"

          [servers.ninep]
          addresses = ["127.0.0.1:5564"]

          [servers.nbd]
          addresses = ["127.0.0.1:10809"]

          [aws]
          access_key_id = "zerofsadmin"
          secret_access_key = "zerofsadmin"
          endpoint = "http://localhost:9000"
          allow_http = "true"

          [telemetry]
          enabled = false
          EOF
            ./zerofs/target/x86_64-unknown-linux-musl/release/zerofs run -c zerofs-pgo.toml &
            ZEROFS_PID=$!
            echo "Waiting for ZeroFS NBD server to start..."
            for i in {1..30}; do
              if nc -z 127.0.0.1 10809; then
                echo "ZeroFS NBD server is ready"
                break
              fi
              sleep 1
            done

            sudo mkdir -p /mnt/zerofs
            sudo mount -t 9p -o trans=tcp,port=5564,version=9p2000.L 127.0.0.1 /mnt/zerofs
            sudo mkdir -p /mnt/zerofs/.nbd
            sudo truncate -s 3G /mnt/zerofs/.nbd/test-device
            sudo umount /mnt/zerofs
            sudo nbd-client 127.0.0.1 10809 /dev/nbd0 -N test-device
            sudo zpool create testpool /dev/nbd0
            sudo zfs create testpool/data
            sudo zfs set mountpoint=/mnt/zfsdata testpool/data
            cd /mnt/zfsdata
            sudo wget -q https://git.kernel.org/torvalds/t/linux-7.2-rc1.tar.gz
            sudo tar -xf linux-7.2-rc1.tar.gz
            sudo zfs snapshot testpool/data@snapshot1
            kill -TERM $ZEROFS_PID || true
            wait $ZEROFS_PID || true

          elif [ "${{ matrix.test }}" = "nfs-kernel-compile" ]; then
            cat > zerofs-pgo.toml << EOF
          [cache]
          dir = "/tmp/zerofs-cache"
          disk_size_gb = 5.0
          memory_size_gb = 2.0

          [storage]
          url = "s3://pgo-nfs-test/test"
          encryption_password = "test-password-123"

          [servers.nfs]
          addresses = ["127.0.0.1:2049"]

          [aws]
          access_key_id = "zerofsadmin"
          secret_access_key = "zerofsadmin"
          endpoint = "http://localhost:9000"
          allow_http = "true"

          [telemetry]
          enabled = false
          EOF
            ./zerofs/target/x86_64-unknown-linux-musl/release/zerofs run -c zerofs-pgo.toml &
            ZEROFS_PID=$!
            echo "Waiting for ZeroFS NFS server to start..."
            for i in {1..30}; do
              if nc -z 127.0.0.1 2049; then
                echo "ZeroFS NFS server is ready"
                break
              fi
              sleep 1
            done

            sudo mkdir -p /mnt/zerofs
            sudo mount -t nfs -o vers=3,async,nolock,rsize=1048576,wsize=1048576,tcp,port=2049,mountport=2049,hard 127.0.0.1:/ /mnt/zerofs
            cd /mnt/zerofs
            wget -q https://git.kernel.org/torvalds/t/linux-7.2-rc1.tar.gz
            tar -xf linux-7.2-rc1.tar.gz
            cd linux-7.2-rc1
            make tinyconfig
            make -j$(nproc)
            cd /
            sudo umount /mnt/zerofs || true
            kill -TERM $ZEROFS_PID || true
            wait $ZEROFS_PID || true
          fi

      - name: Generate PGO data
        run: |
          LLVM_PROFDATA=$(find ~/.rustup -name llvm-profdata | head -1)
          echo "Using llvm-profdata: $LLVM_PROFDATA"

          echo "Profile files generated:"
          ls -la /tmp/pgo-data/

          $LLVM_PROFDATA merge -o merged.profdata /tmp/pgo-data

          mkdir -p pgo-data
          cp merged.profdata pgo-data/
          cp zerofs/Cargo.toml pgo-data/
          cp zerofs/Cargo.lock pgo-data/

      - name: Upload PGO profile data
        uses: actions/upload-artifact@v4
        with:
          name: pgo-profile-data-${{ matrix.test }}
          path: pgo-data/

  merge-pgo-data:
    name: Merge PGO Profile Data
    needs: collect-pgo-profile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust with PGO support
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Download all PGO profile data
        uses: actions/download-artifact@v4
        with:
          pattern: pgo-profile-data-*
          path: pgo-artifacts/

      - name: Merge PGO profiles
        run: |
          LLVM_PROFDATA=$(find ~/.rustup -name llvm-profdata | head -1)
          echo "Using llvm-profdata: $LLVM_PROFDATA"

          PROFDATA_FILES=$(find pgo-artifacts -name "*.profdata" | tr '\n' ' ')
          echo "Found profdata files: $PROFDATA_FILES"

          $LLVM_PROFDATA merge -o merged.profdata $PROFDATA_FILES

          mkdir -p pgo-data
          cp merged.profdata pgo-data/
          cp pgo-artifacts/pgo-profile-data-*/Cargo.toml pgo-data/ || true
          cp pgo-artifacts/pgo-profile-data-*/Cargo.lock pgo-data/ || true

      - name: Upload merged PGO profile data
        uses: actions/upload-artifact@v4
        with:
          name: pgo-profile-data-merged
          path: pgo-data/

  build-webui:
    name: Build WebUI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: hzhou0/slatedb
          ref: ${{ env.SLATEDB_REF }}
          path: slatedb-src

      # zerofs/Cargo.toml patches SlateDB through a path outside this checkout.
      - name: Place the SlateDB checkout
        run: mv slatedb-src ../slatedb

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: webui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: taiki-e/install-action@v2.82.9
        with:
          tool: wasm-pack@0.15.0
          fallback: none

      - name: Install VM image build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools squashfs-tools

      - name: Build WebUI
        run: make webui

      - name: Upload WebUI dist
        uses: actions/upload-artifact@v4
        with:
          name: webui-dist
          path: webui/dist/
          retention-days: 1

  build-release:
    name: Build optimized binary
    needs: [merge-pgo-data, build-webui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: hzhou0/slatedb
          ref: ${{ env.SLATEDB_REF }}
          path: slatedb-src

      # zerofs/Cargo.toml patches SlateDB through a path outside this checkout.
      - name: Place the SlateDB checkout
        run: mv slatedb-src ../slatedb

      - name: Download PGO profile data
        uses: actions/download-artifact@v4
        with:
          name: pgo-profile-data-merged
          path: pgo-data/

      - name: Download WebUI dist
        uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: webui/dist/

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Setup musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"

      - name: Setup PGO profile
        run: |
          cp pgo-data/merged.profdata zerofs/
          cp pgo-data/Cargo.lock zerofs/

      - name: Build with PGO
        run: |
          cd zerofs && RUSTFLAGS="--cfg tokio_unstable --cfg io_uring_skip_arch_check -C profile-use=$(pwd)/merged.profdata" cargo build --release --features webui --target x86_64-unknown-linux-musl

      - name: Prepare binary
        run: |
          mkdir -p artifacts
          cp zerofs/target/x86_64-unknown-linux-musl/release/zerofs artifacts/zerofs-linux-amd64-pgo
          chmod +x artifacts/zerofs-linux-amd64-pgo

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: zerofs-linux-amd64-pgo
          path: artifacts/
          retention-days: 30

  push-image:
    name: Build and push image
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: zerofs-linux-amd64-pgo

      - name: Resolve the SlateDB commit
        id: slatedb
        run: echo "sha=$(git ls-remote https://github.com/hzhou0/slatedb.git "$SLATEDB_REF" | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Name the image
        id: image
        run: |
          echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=2.3.6-${GITHUB_SHA::12}-slatedb-${{ steps.slatedb.outputs.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.multiarch
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.repository }}:${{ steps.image.outputs.tag }}
